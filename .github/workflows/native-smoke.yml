name: Native smoke

on:
  workflow_dispatch:
  pull_request:
    paths: ['src/**', 'capacitor.config.ts', 'package.json']

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.16.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: pnpm exec cap add android
      - run: pnpm native:configure
      - run: pnpm exec cap sync android
      - run: cd android && ./gradlew assembleDebug

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.16.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: pnpm exec cap add ios
      - run: pnpm native:configure
      - run: pnpm exec cap sync ios
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
